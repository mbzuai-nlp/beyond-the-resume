server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/reviewer/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
