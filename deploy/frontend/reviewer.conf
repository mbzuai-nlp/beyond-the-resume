server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        auth_basic "Reviewer console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri /index.html;
    }

    location /api/ {
        auth_basic "Reviewer console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header X-Reviewer-Username $remote_user;
        proxy_pass http://backend:8000;
    }
}
